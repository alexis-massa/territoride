<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}TerritoRide{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
    }
    .page {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover { color: #1a1a1a; }
    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 1px 10px rgba(0, 0, 0, 0.07);
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.25rem;
    }
    .player-dot {
      display: inline-block;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .score-bar {
      display: flex;
      height: 0.5rem;
      border-radius: 999px;
      overflow: hidden;
      background: #eee;
      margin: 0.5rem 0;
    }
    .score-bar-territory { background: #3b6fd6; }
    .score-bar-poi { background: #7a5230; }
    .legend {
      display: flex;
      gap: 1.25rem;
      font-size: 0.8rem;
      color: #666;
    }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .legend-swatch { width: 0.6rem; height: 0.6rem; border-radius: 2px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
