<div id="topbar">
  <a href="{% url 'leaderboard' %}" id="leaderboard-link">Leaderboard</a>
  {% if user.is_authenticated %}
    <div id="account-menu">
      <a href="{% url 'accounts:profile' %}" id="whoami">{{ user.username }}</a>
      <div id="account-dropdown">
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" id="logout">Log out</button>
        </form>
      </div>
    </div>
  {% else %}
    <button id="connect-strava">Connect with Strava</button>
  {% endif %}
</div>
<style>
  #topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    justify-content: flex-end;
    padding: 0.75rem 1rem;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  #leaderboard-link {
    display: block;
    background: white;
    border-radius: 4px;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    color: inherit;
    text-decoration: none;
  }
  #connect-strava {
    background: #fc4c02;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #account-menu {
    position: relative;
  }
  #whoami {
    display: block;
    background: white;
    border-radius: 4px;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    color: inherit;
    text-decoration: none;
  }
  #account-dropdown {
    display: none;
    flex-direction: column;
    gap: 0.25rem;
    position: absolute;
    top: 100%;
    right: 0;
    width: 100%;
  }
  #account-menu:hover #account-dropdown {
    display: flex;
  }
  #account-dropdown a,
  #account-dropdown button {
    display: block;
    width: 100%;
    background: white;
    border: none;
    border-radius: 4px;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    color: inherit;
    text-decoration: none;
    text-align: left;
    cursor: pointer;
    box-sizing: border-box;
  }
</style>
<script>
  var connectButton = document.getElementById("connect-strava");
  if (connectButton) {
    connectButton.addEventListener("click", function () {
      var popup = window.open(
        "{% url 'accounts:strava_authorize' %}",
        "strava_oauth",
        "width=600,height=700"
      );

      function handleMessage(event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.source !== "strava-oauth") return;
        window.removeEventListener("message", handleMessage);
        if (event.data.status !== "success") {
          alert(event.data.message || "Strava connection failed.");
        }
      }
      window.addEventListener("message", handleMessage);

      // Reload once the popup closes, regardless of whether postMessage
      // arrived - covers browsers where it can be lost or delayed.
      var poll = setInterval(function () {
        if (popup.closed) {
          clearInterval(poll);
          window.location.reload();
        }
      }, 500);
    });
  }
</script>
