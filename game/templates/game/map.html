{% extends "base.html" %}
{% load static %}

{% block head %}
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .owner-tooltip .maplibregl-popup-tip { display: none; }
    .owner-tooltip .maplibregl-popup-content {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      font-size: 0.85rem;
    }
    .owner-tooltip-dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
{% endblock %}

{% block body %}
  {% include "accounts/_topbar.html" %}
  {% include "game/_layers_menu.html" %}
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script>
    var EMPTY_FC = { type: "FeatureCollection", features: [] };

    // map.loadImage() can't reliably decode SVG - it's built for raster
    // images. Rendering through a <img> + <canvas> instead uses the
    // browser's normal SVG rendering, which is universally supported.
    function loadIconAsImageData(url) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    var map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [5.8, 45.4], // Rhone-Alpes
      zoom: 8,
    });

    var gridVisible = true;

    map.on("load", function () {
      map.addSource("grid", { type: "geojson", data: EMPTY_FC });
      map.addLayer({
        id: "grid-fill",
        type: "fill",
        source: "grid",
        paint: { "fill-color": "#3388ff", "fill-opacity": 0.05, "fill-outline-color": "#000000" },
      });

      map.addSource("territory", { type: "geojson", data: EMPTY_FC });
      map.addLayer({
        id: "territory-fill",
        type: "fill",
        source: "territory",
        paint: { "fill-color": ["get", "color"], "fill-opacity": 0.35, "fill-outline-color": "#000000" },
      });

      var ownerPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        className: "owner-tooltip",
        offset: 10,
      });
      map.on("mousemove", "territory-fill", function (e) {
        map.getCanvas().style.cursor = "pointer";
        var props = e.features[0].properties;
        var html =
          '<span class="owner-tooltip-dot" style="background:' +
          props.color +
          '"></span>' +
          props.owner;
        ownerPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
      });
      map.on("mouseleave", "territory-fill", function () {
        map.getCanvas().style.cursor = "";
        ownerPopup.remove();
      });

      map.addSource("routes", { type: "geojson", data: EMPTY_FC });
      map.addLayer({
        id: "routes-line",
        type: "line",
        source: "routes",
        paint: { "line-color": ["get", "color"], "line-width": 2 },
      });

      loadIconAsImageData("{% static 'game/icons/pass.svg' %}").then(function (imageData) {
        map.addImage("pass", imageData);
        map.addSource("pois", { type: "geojson", data: EMPTY_FC });
        map.addLayer({
          id: "pois-icon",
          type: "symbol",
          source: "pois",
          layout: {
            "icon-image": "pass",
            "icon-size": ["interpolate", ["linear"], ["zoom"], 6, 0.15, 10, 0.4, 14, 1],
            "icon-allow-overlap": true,
          },
        });

        var poiPopup = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          className: "owner-tooltip",
          offset: 10,
        });
        map.on("mousemove", "pois-icon", function (e) {
          map.getCanvas().style.cursor = "pointer";
          var props = e.features[0].properties;
          var html = props.name;
          if (props.altitude_m) html += " · " + props.altitude_m + "m";
          if (props.owner) {
            html =
              '<span class="owner-tooltip-dot" style="background:' +
              props.color +
              '"></span>' +
              html +
              " · " +
              props.owner;
          }
          poiPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
        });
        map.on("mouseleave", "pois-icon", function () {
          map.getCanvas().style.cursor = "";
          poiPopup.remove();
        });

        function loadPOIs() {
          fetch("{% url 'pois_geojson' %}")
            .then(function (resp) {
              return resp.json();
            })
            .then(function (data) {
              map.getSource("pois").setData(data);
            });
        }

        loadPOIs();

        document.getElementById("toggle-pois").addEventListener("change", function (e) {
          if (e.target.checked) {
            loadPOIs();
          } else {
            map.getSource("pois").setData(EMPTY_FC);
          }
        });
      });

      function updateGrid() {
        if (!gridVisible) return;
        var bounds = map.getBounds();
        var bbox = [
          bounds.getWest(),
          bounds.getSouth(),
          bounds.getEast(),
          bounds.getNorth(),
        ].join(",");
        fetch("{% url 'grid_geojson' %}?bbox=" + encodeURIComponent(bbox))
          .then(function (resp) {
            return resp.json();
          })
          .then(function (data) {
            map.getSource("grid").setData(data);
          });
      }

      function loadTerritory() {
        fetch("{% url 'territory_geojson' %}")
          .then(function (resp) {
            return resp.json();
          })
          .then(function (data) {
            map.getSource("territory").setData(data);
          });
      }

      function loadRoutes() {
        fetch("{% url 'routes_geojson' %}")
          .then(function (resp) {
            return resp.json();
          })
          .then(function (data) {
            map.getSource("routes").setData(data);
          });
      }

      map.on("moveend", updateGrid);
      updateGrid();
      loadTerritory();
      loadRoutes();

      document.getElementById("toggle-grid").addEventListener("change", function (e) {
        gridVisible = e.target.checked;
        if (gridVisible) {
          updateGrid();
        } else {
          map.getSource("grid").setData(EMPTY_FC);
        }
      });

      document.getElementById("toggle-territory").addEventListener("change", function (e) {
        if (e.target.checked) {
          loadTerritory();
        } else {
          map.getSource("territory").setData(EMPTY_FC);
        }
      });

      document.getElementById("toggle-routes").addEventListener("change", function (e) {
        if (e.target.checked) {
          loadRoutes();
        } else {
          map.getSource("routes").setData(EMPTY_FC);
        }
      });
    });
  </script>
{% endblock %}
