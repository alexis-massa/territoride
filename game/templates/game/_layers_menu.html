<div id="layers-menu">
  {% if user.is_authenticated %}
    <label title="Hide other players and colour your own tiles, rides and passes by how recently you visited"><input type="checkbox" id="toggle-mine"> Only my activity</label>
    <div id="recency-legend" hidden>
      <div id="recency-bar"></div>
      <div id="recency-labels"><span>today</span><span>{{ decay_threshold_days }} days ago</span></div>
    </div>
    <hr>
  {% endif %}
  <label><input type="checkbox" id="toggle-territory" checked> Territory</label>
  <label><input type="checkbox" id="toggle-routes" checked> Routes</label>
  <details id="poi-types-menu">
    <summary>Points of interest</summary>
    {% for value, label in poi_types %}
      <label><input type="checkbox" class="poi-type-toggle" data-poi-type="{{ value }}" id="poi-type-{{ value }}" checked> {{ label }}</label>
    {% endfor %}
  </details>
</div>
<style>
  #layers-menu {
    position: absolute;
    bottom: 1rem;
    left: 1rem;
    z-index: 1;
    background: white;
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  #layers-menu hr { width: 100%; border: 0; border-top: 1px solid #ddd; margin: 0.15rem 0; }
  #recency-legend { padding-left: 1.4rem; }
  #recency-bar {
    height: 0.5rem;
    border-radius: 3px;
    background: linear-gradient(to right, #2ecc71, #f1c40f, #e67e22, #e74c3c);
  }
  #recency-labels { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.75rem; color: #555; }
  #poi-types-menu summary {
    cursor: pointer;
    list-style: none;
  }
  #poi-types-menu summary::-webkit-details-marker { display: none; }
  #poi-types-menu summary::before { content: "\25b8\00a0"; }
  #poi-types-menu[open] summary::before { content: "\25be\00a0"; }
  #poi-types-menu label { display: block; padding-left: 1.1rem; margin-top: 0.25rem; }
</style>
