{% extends "base.html" %}
{% load static %}

{% block head %}
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .owner-tooltip .maplibregl-popup-tip { display: none; }
    .owner-tooltip .maplibregl-popup-content {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      font-size: 0.85rem;
    }
    .owner-tooltip-dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
{% endblock %}

{% block body %}
  {% include "accounts/_topbar.html" %}
  {% include "game/_layers_menu.html" %}
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script>
    var EMPTY_FC = { type: "FeatureCollection", features: [] };

    // Restore each layer checkbox from localStorage and keep it persisted,
    // independently of the per-layer load/clear listeners below.
    ["toggle-grid", "toggle-territory", "toggle-routes", "toggle-pois"].forEach(function (id) {
      var stored = localStorage.getItem(id);
      if (stored !== null) document.getElementById(id).checked = stored === "true";
      document.getElementById(id).addEventListener("change", function (e) {
        localStorage.setItem(id, e.target.checked);
      });
    });

    // map.loadImage() can't reliably decode SVG - it's built for raster
    // images. Rendering through a <img> + <canvas> instead uses the
    // browser's normal SVG rendering, which is universally supported.
    function loadIconAsImageData(url) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    var map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [5.8, 45.4], // Rhone-Alpes
      zoom: 8,
    });

    function currentBbox() {
      var bounds = map.getBounds();
      return [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()].join(",");
    }

    function loadSource(sourceId, url) {
      fetch(url)
        .then(function (resp) {
          return resp.json();
        })
        .then(function (data) {
          map.getSource(sourceId).setData(data);
        });
    }

    var gridVisible = document.getElementById("toggle-grid").checked;

    map.on("load", function () {
      map.addSource("grid", { type: "geojson", data: EMPTY_FC });
      map.addLayer({
        id: "grid-fill",
        type: "fill",
        source: "grid",
        paint: { "fill-color": "#3388ff", "fill-opacity": 0.05, "fill-outline-color": "#000000" },
      });

      map.addSource("territory", { type: "geojson", data: EMPTY_FC });
      map.addLayer({
        id: "territory-fill",
        type: "fill",
        source: "territory",
        paint: { "fill-color": ["get", "color"], "fill-opacity": 0.35, "fill-outline-color": "#000000" },
      });

      var ownerPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        className: "owner-tooltip",
        offset: 10,
      });
      map.on("mousemove", "territory-fill", function (e) {
        map.getCanvas().style.cursor = "pointer";
        var props = e.features[0].properties;
        var html =
          '<span class="owner-tooltip-dot" style="background:' +
          props.color +
          '"></span>' +
          props.owner;
        ownerPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
      });
      map.on("mouseleave", "territory-fill", function () {
        map.getCanvas().style.cursor = "";
        ownerPopup.remove();
      });

      map.addSource("routes", { type: "geojson", data: EMPTY_FC });
      map.addLayer({
        id: "routes-line",
        type: "line",
        source: "routes",
        paint: { "line-color": ["get", "color"], "line-width": 2 },
      });

      loadIconAsImageData("{% static 'game/icons/pass.svg' %}").then(function (imageData) {
        map.addImage("pass", imageData);
        map.addSource("pois", { type: "geojson", data: EMPTY_FC });
        map.addLayer({
          id: "pois-circle",
          type: "circle",
          source: "pois",
          paint: {
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 6, 2, 10, 5, 14, 13],
            "circle-color": ["case", ["==", ["get", "owner"], null], "#000000", ["get", "color"]],
            "circle-stroke-width": 2,
            "circle-stroke-color": "#ffffff",
          },
        });
        map.addLayer({
          id: "pois-icon",
          type: "symbol",
          source: "pois",
          layout: {
            "icon-image": "pass",
            "icon-size": ["interpolate", ["linear"], ["zoom"], 6, 0.15, 10, 0.4, 14, 1],
            "icon-allow-overlap": true,
          },
        });

        var poiPopup = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          className: "owner-tooltip",
          offset: 10,
        });
        function showPoiPopup(e) {
          map.getCanvas().style.cursor = "pointer";
          var props = e.features[0].properties;
          var html = props.name;
          if (props.altitude_m) html += " · " + props.altitude_m + "m";
          html =
            '<span class="owner-tooltip-dot" style="background:' +
            (props.owner ? props.color : "#000000") +
            '"></span>' +
            html +
            " · " +
            (props.owner || "unclaimed");
          poiPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
        }
        function hidePoiPopup() {
          map.getCanvas().style.cursor = "";
          poiPopup.remove();
        }
        ["pois-circle", "pois-icon"].forEach(function (layerId) {
          map.on("mousemove", layerId, showPoiPopup);
          map.on("mouseleave", layerId, hidePoiPopup);
        });

        var poisVisible = document.getElementById("toggle-pois").checked;

        function loadPOIs() {
          if (!poisVisible) return;
          loadSource("pois", "{% url 'pois_geojson' %}?bbox=" + encodeURIComponent(currentBbox()));
        }

        map.on("moveend", loadPOIs);
        loadPOIs();

        document.getElementById("toggle-pois").addEventListener("change", function (e) {
          poisVisible = e.target.checked;
          if (poisVisible) {
            loadPOIs();
          } else {
            map.getSource("pois").setData(EMPTY_FC);
          }
        });
      });

      function updateGrid() {
        if (!gridVisible) return;
        loadSource("grid", "{% url 'grid_geojson' %}?bbox=" + encodeURIComponent(currentBbox()));
      }

      function loadTerritory() {
        loadSource("territory", "{% url 'territory_geojson' %}");
      }

      function loadRoutes() {
        loadSource("routes", "{% url 'routes_geojson' %}");
      }

      map.on("moveend", updateGrid);
      updateGrid();
      if (document.getElementById("toggle-territory").checked) loadTerritory();
      if (document.getElementById("toggle-routes").checked) loadRoutes();

      document.getElementById("toggle-grid").addEventListener("change", function (e) {
        gridVisible = e.target.checked;
        if (gridVisible) {
          updateGrid();
        } else {
          map.getSource("grid").setData(EMPTY_FC);
        }
      });

      document.getElementById("toggle-territory").addEventListener("change", function (e) {
        if (e.target.checked) {
          loadTerritory();
        } else {
          map.getSource("territory").setData(EMPTY_FC);
        }
      });

      document.getElementById("toggle-routes").addEventListener("change", function (e) {
        if (e.target.checked) {
          loadRoutes();
        } else {
          map.getSource("routes").setData(EMPTY_FC);
        }
      });
    });
  </script>
{% endblock %}
