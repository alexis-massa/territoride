# pi-kit v0.4.1
# Runs on the Pi from ~/INSTANCE/ (deploy.sh copies this file there; INSTANCE is the app's name unless set).
# Values come from that folder's .env (APP_DOMAIN). See pi-infra APP_CONTRACT.md.
name: territoride

services:
  app:
    image: territoride:current
    restart: unless-stopped
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    user: "65534:65534"
    networks: [web, data]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    labels:
      caddy: ${APP_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.encode: zstd gzip
      caddy.header.Strict-Transport-Security: "max-age=31536000"

networks:
  web:
    external: true
  data:
    external: true
