# pi-kit v0.4.4
# pi-common is a private git dependency: let cargo use the system git, which uses your SSH agent.
[net]
git-fetch-with-cli = true

# Compile-time checked queries read .sqlx/ (committed), so a fresh clone builds without a database.
# `just prepare` refreshes it against the local database.
[env]
SQLX_OFFLINE = "true"
