services:
  db:
    ports: !reset []
    networks:
      default:
      # Lets other apps on this host (e.g. fittracker) reach this Postgres
      # instance directly, via a dedicated database/role - not the same
      # database territoride itself uses.
      data:
        aliases:
          - territoride-db

  app:
    command: uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
    ports: !reset []
    networks:
      default:
      web:
    labels:
      - "caddy=${ALLOWED_HOSTS}"
      - "caddy.reverse_proxy={{upstreams 8000}}"

# Reverse-proxied by the shared Caddy in the sibling `caddy-docker-proxy` repo, which
# discovers this service via the labels above - see that repo for setup.
networks:
  web:
    external: true
  data:
    name: data
